<style>
  :root {
    --bg: #f6f1e8;
    --bg-2: #ece4d3;
    --ink: #1f2a26;
    --ink-2: #4a564f;
    --line: #d9cfbb;
    --accent: #2f5d4c;
    --accent-ink: #f6f1e8;
    --gold: #b08544;
    --terracotta: #b8593a;
    --card: #fbf7ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .display, h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; margin: 0; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  a { color: inherit; }
  .loading { min-height: 100vh; display: grid; place-items: center; font-size: 20px; color: var(--ink-2); }
</style>
</head>
<body>

<div id="root"><div class="loading">Loading the presale…</div></div>
<noscript><p style="padding:24px;font-size:18px">Please turn on JavaScript to choose your plot, or call our office and we will help you.</p></noscript>

<script type="text/babel" src="presale.jsx"></script>
<script type="text/babel">
  // The presale on its own page, so it opens in its own browser tab (/presale or /presale?type=regular).
  function PresalePage() {
    const [tiers, setTiers] = React.useState([]);
    React.useEffect(() => {
      // Same product prices as the main site; the flow has built-in prices if this cannot load.
      if (!window.db) return;
      window.db.collection('products').orderBy('sortOrder').get()
        .then((snap) => { if (!snap.empty) setTiers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); })
        .catch(() => {});
    }, []);
    const startType = new URLSearchParams(window.location.search).get('type') || '';
    const goHome = () => {
      // Closes this tab when the site opened it; otherwise goes back to the main site.
      try { window.close(); } catch (e) {}
      setTimeout(() => { window.location.href = '/'; }, 250);
    };
    return <window.PresaleFlow fullPage tiers={tiers} startType={startType} onClose={goHome} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<PresalePage />);
</script>
</body>
</html>
