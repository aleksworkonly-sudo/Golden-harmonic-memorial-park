<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golden Harmonic Memorial Park — A place of peace in Palawan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Firebase (Firestore + Auth) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
  :root {
    /* default palette — Sage & Sand */
    --bg: #f6f1e8;
    --bg-2: #ece4d3;
    --ink: #1f2a26;
    --ink-2: #4a564f;
    --line: #d9cfbb;
    --accent: #2f5d4c;       /* deep forest */
    --accent-ink: #f6f1e8;
    --gold: #b08544;         /* warm gold */
    --terracotta: #b8593a;
    --card: #fbf7ee;
    --shadow: 0 1px 0 rgba(31,42,38,.04), 0 14px 40px -22px rgba(31,42,38,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .display, h1, h2, h3 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
    text-wrap: balance;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  a { color: inherit; }

  /* Layout */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 20px; } }

  /* Utility top bar */
  .utility {
    background: var(--ink);
    color: #e7e0cf;
    font-size: 13px;
  }
  .utility .row {
    display: flex; justify-content: space-between; align-items: center;
    height: 38px;
  }
  .utility .links { display: flex; gap: 22px; }
  .utility a { text-decoration: none; opacity: .85; }
  .utility a:hover { opacity: 1; }
  .utility .pill {
    background: var(--gold); color: #1f1607; padding: 4px 12px; border-radius: 999px;
    font-weight: 600; font-size: 12px; letter-spacing: .02em;
  }

  /* Header */
  header.site {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(8px);
    background: color-mix(in oklab, var(--bg) 92%, transparent);
  }
  header.site .row {
    display: flex; justify-content: space-between; align-items: center;
    height: 76px;
  }
  .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: 'Newsreader', serif; font-size: 22px; font-style: italic;
  }
  .brand-text { line-height: 1.1; }
  .brand-text .name { font-family: 'Newsreader', serif; font-size: 20px; color: var(--ink); }
  .brand-text .sub { font-size: 11px; color: var(--ink-2); letter-spacing: .14em; text-transform: uppercase; }
  nav.primary { display: flex; gap: 28px; }
  nav.primary a { text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 500; }
  nav.primary a:hover { color: var(--ink); }
  @media (max-width: 860px) { nav.primary { display: none; } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-radius: 999px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    border: 1px solid transparent; cursor: pointer; text-decoration: none;
    transition: transform .15s ease, background .2s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { transform: translateY(-1px); background: color-mix(in oklab, var(--accent) 88%, black); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--bg-2); }
  .btn-gold { background: var(--gold); color: #1f1607; }
  .btn-gold:hover { transform: translateY(-1px); }

  /* Hero */
  .hero {
    padding: 70px 0 100px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 60px; align-items: center; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--accent); letter-spacing: .15em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before {
    content: ''; width: 24px; height: 1px; background: var(--accent);
  }
  .hero h1 {
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1.05;
    margin: 22px 0 22px;
  }
  .hero h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .hero .lede { font-size: 18px; color: var(--ink-2); max-width: 520px; }
  .hero .cta-row { display: flex; gap: 14px; margin-top: 32px; flex-wrap: wrap; }
  .hero .meta {
    margin-top: 36px;
    display: flex; gap: 28px; flex-wrap: wrap;
    padding-top: 28px; border-top: 1px solid var(--line);
  }
  .hero .meta div .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .hero .meta div .value { font-family: 'Newsreader', serif; font-size: 22px; }

  /* Placeholder (striped SVG) */
  .ph {
    background:
      repeating-linear-gradient(
        135deg,
        color-mix(in oklab, var(--accent) 12%, var(--bg-2)) 0 12px,
        var(--bg-2) 12px 24px
      );
    border: 1px solid var(--line);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    display: grid; place-items: center;
    color: var(--ink);
  }
  .ph .ph-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    background: color-mix(in oklab, var(--bg) 92%, transparent);
    padding: 6px 12px; border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--ink-2);
    text-align: center;
  }
  .ph.aspect-hero { aspect-ratio: 4/5; }
  .ph.aspect-wide { aspect-ratio: 16/10; }

  /* Illustrated scenes (stand-in artwork, replaces the striped placeholder) */
  .ph.illustrated { background: none; display: block; }
  .ph.illustrated .scene-svg { width: 100%; height: 100%; display: block; }
  .ph.illustrated .ph-label-overlay {
    position: absolute; left: 10px; bottom: 10px;
    font-size: 10px; padding: 4px 9px;
    background: color-mix(in oklab, var(--ink) 55%, transparent);
    color: #f6f1e8; border: none; text-align: left;
    opacity: 0; transition: opacity .2s ease;
  }
  .ph.illustrated:hover .ph-label-overlay { opacity: 1; }
  .ph.aspect-square { aspect-ratio: 1/1; }
  .ph.aspect-tall { aspect-ratio: 3/4; }

  /* Trust strip */
  .trust {
    background: var(--bg-2);
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }
  .trust .row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px;
  }
  @media (max-width: 800px) { .trust .row { grid-template-columns: repeat(2, 1fr); } }
  .trust .item { display: flex; flex-direction: column; gap: 4px; }
  .trust .item .big { font-family: 'Newsreader', serif; font-size: 28px; color: var(--accent); }
  .trust .item .lbl { font-size: 13px; color: var(--ink-2); }

  /* Sections generic */
  section.block { padding: 90px 0; border-bottom: 1px solid var(--line); }
  .section-head { display: flex; justify-content: space-between; align-items: end; gap: 40px; margin-bottom: 50px; }
  .section-head h2 { font-size: clamp(32px, 4vw, 48px); line-height: 1.1; max-width: 620px; }
  .section-head .side { max-width: 380px; color: var(--ink-2); font-size: 15px; }
  @media (max-width: 800px) { .section-head { flex-direction: column; align-items: start; } }

  /* Pricing cards */
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .cat-head {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
    margin: 30px 0 16px;
  }
  .cat-head:first-of-type { margin-top: 8px; }
  .tiers.single { grid-template-columns: minmax(0, 380px); }
  @media (max-width: 980px) { .tiers { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .tiers { grid-template-columns: 1fr; } }
  .tier {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: var(--shadow);
    position: relative;
    transition: transform .2s ease, border-color .2s ease;
  }
  .tier:hover { transform: translateY(-3px); border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
  .tier.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent), var(--shadow); }
  .tier.featured.selected { box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 35%, transparent), var(--shadow); }
  .tier .ph { height: 150px; }
  .tier.featured { background: var(--ink); color: #e7e0cf; border-color: var(--ink); }
  .tier.featured h3, .tier.featured .price { color: #f6f1e8; }
  .tier.featured .ph {
    background:
      repeating-linear-gradient(
        135deg,
        color-mix(in oklab, var(--gold) 25%, #2a3a33) 0 12px,
        #2a3a33 12px 24px
      );
    border-color: #3a4a43;
  }
  .tier.featured .ph .ph-label { background: #2a3a33; border-color: #3a4a43; color: #d9cfbb; }
  .tier.featured .feature-list li { color: #c8c0ad; }
  .tier.featured .feature-list li::before { background: var(--gold); }
  .tier.featured .small { color: #b6ad97; }
  .tier .badge {
    position: absolute; top: 16px; right: 16px;
    background: var(--gold); color: #1f1607;
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    padding: 4px 10px; border-radius: 999px;
  }
  .tier h3 { font-size: 22px; }
  .tier .desc { font-size: 14px; color: var(--ink-2); }
  .tier.featured .desc { color: #b6ad97; }
  .tier .price-row { display: flex; align-items: baseline; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line); padding-top: 18px; }
  .tier.featured .price-row { border-color: #3a4a43; }
  .tier .price { font-family: 'Newsreader', serif; font-size: 36px; line-height: 1; }
  .tier .price .currency { font-size: 18px; vertical-align: top; margin-right: 2px; color: var(--ink-2); }
  .tier.featured .price .currency { color: #b6ad97; }
  .tier .from { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .tier .monthly {
    background: color-mix(in oklab, var(--gold) 18%, var(--bg));
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tier.featured .monthly { background: #2a3a33; color: #d9cfbb; }
  .tier .monthly strong { font-family: 'Newsreader', serif; font-size: 18px; color: var(--terracotta); font-weight: 500; }
  .tier.featured .monthly strong { color: var(--gold); }
  .feature-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .feature-list li { font-size: 13px; color: var(--ink-2); padding-left: 18px; position: relative; }
  .feature-list li::before {
    content: ''; position: absolute; left: 0; top: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  .tier .btn { width: 100%; justify-content: center; margin-top: auto; }
  .small { font-size: 12px; color: var(--ink-2); }

  /* Payment plans */
  .plans-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: start; }
  @media (max-width: 900px) { .plans-grid { grid-template-columns: 1fr; gap: 40px; } }
  .plan-table {
    width: 100%; border-collapse: collapse;
    background: var(--card); border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .plan-table th, .plan-table td {
    padding: 18px 20px; text-align: left; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .plan-table th {
    background: var(--bg-2); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2);
  }
  .plan-table tr:last-child td { border-bottom: none; }
  .plan-table td.highlight { background: color-mix(in oklab, var(--gold) 15%, var(--card)); font-weight: 600; }
  .plan-table .pct { color: var(--terracotta); font-family: 'Newsreader', serif; font-size: 18px; }

  /* Investment */
  .invest {
    background: linear-gradient(180deg, var(--ink) 0%, #14201c 100%);
    color: #e7e0cf;
  }
  .invest h2, .invest .display { color: #f6f1e8; }
  .invest .eyebrow { color: var(--gold); }
  .invest .eyebrow::before { background: var(--gold); }
  .invest .section-head .side { color: #b6ad97; }
  .invest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
  @media (max-width: 900px) { .invest-grid { grid-template-columns: 1fr; } }
  .invest-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 32px; }
  .invest-stat {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 22px;
  }
  .invest-stat .num { font-family: 'Newsreader', serif; font-size: 42px; color: var(--gold); line-height: 1; }
  .invest-stat .lbl { font-size: 13px; color: #b6ad97; margin-top: 8px; }
  .chart-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 28px;
  }
  .chart-card h4 { font-family: 'Newsreader', serif; font-size: 20px; font-weight: 400; margin: 0 0 6px; }
  .chart-card .chart-meta { font-size: 13px; color: #b6ad97; margin-bottom: 24px; }

  /* Pre-need vs at-need */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 800px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 32px;
  }
  .compare-card.recommended { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 5%, var(--card)); }
  .compare-card .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
  .compare-card.recommended .tag { color: var(--accent); }
  .compare-card h3 { font-size: 28px; margin: 8px 0 12px; }
  .compare-card .save {
    background: var(--gold); color: #1f1607; display: inline-block;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    margin-bottom: 16px;
  }
  .compare-card ul { list-style: none; padding: 0; margin: 18px 0 0; }
  .compare-card ul li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 10px; align-items: start; }
  .compare-card ul li:last-child { border-bottom: none; }
  .compare-card ul li .check { color: var(--accent); font-weight: 700; flex-shrink: 0; }

  /* Gallery */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
  }
  .gallery-grid .ph:nth-child(1) { grid-column: span 7; aspect-ratio: 16/10; }
  .gallery-grid .ph:nth-child(2) { grid-column: span 5; aspect-ratio: 4/5; grid-row: span 2; }
  .gallery-grid .ph:nth-child(3) { grid-column: span 3; aspect-ratio: 1/1; }
  .gallery-grid .ph:nth-child(4) { grid-column: span 4; aspect-ratio: 1/1; }
  .gallery-grid .ph:nth-child(5) { grid-column: span 6; aspect-ratio: 16/10; }
  .gallery-grid .ph:nth-child(6) { grid-column: span 6; aspect-ratio: 16/10; }
  @media (max-width: 800px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-grid .ph { grid-column: span 1 !important; aspect-ratio: 1/1 !important; grid-row: auto !important; }
  }

  /* Locations */
  .loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 800px) { .loc-grid { grid-template-columns: 1fr; } }
  .loc-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
  }
  .loc-card .ph { aspect-ratio: 16/9; border-radius: 0; border-left: none; border-right: none; border-top: none; }
  .loc-card .body { padding: 28px; }
  .loc-card h3 { font-size: 26px; margin-bottom: 6px; }
  .loc-card .area { font-size: 13px; color: var(--ink-2); margin-bottom: 16px; }
  .loc-card .amenities { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 20px; }
  .loc-card .amenity {
    background: var(--bg-2); padding: 5px 10px; border-radius: 999px;
    font-size: 12px; color: var(--ink-2);
  }

  /* About */
  .about-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 60px; align-items: center; }
  @media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; } }
  .about-grid p { font-size: 16px; color: var(--ink-2); margin: 0 0 18px; }
  .faiths { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .faith-chip {
    background: var(--bg-2); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; border: 1px solid var(--line);
  }

  /* Testimonials */
  .testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 800px) { .testi-grid { grid-template-columns: 1fr; } }
  .testi {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .testi .quote-mark { font-family: 'Newsreader', serif; font-size: 56px; line-height: .6; color: var(--accent); }
  .testi .quote { font-family: 'Newsreader', serif; font-size: 19px; line-height: 1.4; }
  .testi .who { display: flex; gap: 12px; align-items: center; padding-top: 18px; border-top: 1px solid var(--line); }
  .testi .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--bg-2); display: grid; place-items: center;
    font-family: 'Newsreader', serif; color: var(--accent); font-size: 18px;
  }
  .testi .name { font-weight: 600; font-size: 14px; }
  .testi .role { font-size: 12px; color: var(--ink-2); }

  /* FAQ */
  .faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
  @media (max-width: 800px) { .faq-grid { grid-template-columns: 1fr; } }
  .faq-item {
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    cursor: pointer;
  }
  .faq-item summary {
    list-style: none; display: flex; justify-content: space-between; align-items: start;
    gap: 18px; cursor: pointer; font-family: 'Newsreader', serif; font-size: 19px;
  }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item .toggle {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg-2);
    display: grid; place-items: center; flex-shrink: 0;
    transition: transform .2s ease, background .2s ease;
    font-size: 14px; color: var(--accent);
  }
  .faq-item[open] .toggle { transform: rotate(45deg); background: var(--accent); color: var(--accent-ink); }
  .faq-item .answer { padding-top: 14px; color: var(--ink-2); font-size: 15px; }

  /* Brochure CTA / Form */
  .brochure {
    background: var(--bg-2);
    padding: 100px 0;
  }
  .brochure-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
  @media (max-width: 900px) { .brochure-grid { grid-template-columns: 1fr; } }
  .brochure h2 { font-size: clamp(34px, 4vw, 52px); line-height: 1.05; }
  .brochure .lede { font-size: 17px; color: var(--ink-2); margin: 18px 0 28px; max-width: 460px; }
  .brochure .perks { display: flex; flex-direction: column; gap: 12px; }
  .brochure .perks div { display: flex; gap: 12px; align-items: start; font-size: 14px; }
  .brochure .perks .ico {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .form-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 36px; box-shadow: var(--shadow);
  }
  .form-card h3 { font-size: 24px; margin-bottom: 4px; }
  .form-card .form-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 22px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .field input, .field select {
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-family: 'Inter', sans-serif; font-size: 14px;
    color: var(--ink); outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 540px) { .field-row { grid-template-columns: 1fr; } }
  .form-card .btn { width: 100%; justify-content: center; margin-top: 8px; padding: 15px; }

  /* Footer */
  footer {
    background: var(--ink);
    color: #c8c0ad;
    padding: 70px 0 30px;
  }
  footer .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 50px; }
  @media (max-width: 800px) { footer .grid { grid-template-columns: 1fr 1fr; } }
  footer h4 { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #b6ad97; margin: 0 0 18px; font-weight: 600; }
  footer .brand-text .name { color: #f6f1e8; }
  footer .brand-text .sub { color: #b6ad97; }
  footer ul { list-style: none; padding: 0; margin: 0; }
  footer ul li { margin-bottom: 10px; font-size: 14px; }
  footer ul li a { color: #c8c0ad; text-decoration: none; }
  footer ul li a:hover { color: #f6f1e8; }
  footer .legal {
    border-top: 1px solid #2a3a33;
    padding-top: 28px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    font-size: 12px; color: #8c8473;
  }

  /* Animation utility */
  .fade-up { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; transition-delay: calc(var(--stagger, 0) * 70ms); }
  .fade-up.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .fade-up { opacity: 1; transform: none; transition: none; }
  }

  /* ---------- Signature: rainforest ridgeline dividers ---------- */
  /* Palawan's forest canopy line, redrawn as a recurring horizon between sections */
  .cliff-divider {
    position: relative;
    height: 56px;
    overflow: hidden;
    background: var(--bg);
  }
  .cliff-divider svg { position: absolute; left: 0; bottom: -1px; width: 100%; height: 100%; display: block; }
  .cliff-divider.on-dark { background: var(--ink); }
  .cliff-divider.flip svg { transform: scaleY(-1); }

  /* ---------- Hero atmosphere ---------- */
  .hero { overflow: hidden; }
  .hero-atmosphere {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(680px 420px at 82% -8%, color-mix(in oklab, var(--gold) 22%, transparent), transparent 70%),
      radial-gradient(520px 380px at -6% 90%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%);
  }
  .hero .hero-grid { position: relative; z-index: 1; }

  /* ---------- Signature: the soul's passage (hero scene motion) ---------- */
  .voyage-boat { animation: voyageBob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes voyageBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .voyage-specks circle { animation: voyageTwinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes voyageTwinkle { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .voyage-boat, .voyage-specks circle { animation: none; }
  }

  /* ---------- Motion: stagger + tilt + count-up ---------- */
  .tilt { transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease; }
  .tilt:hover { transform: translateY(-5px); }
  .count-num { display: inline-block; }

  /* ---------- Gallery / clickable photo frames ---------- */
  .gallery-grid .ph, .tier .ph.clickable, .loc-card .ph.clickable {
    cursor: zoom-in;
    transition: transform .35s ease, filter .35s ease;
  }
  .gallery-grid .ph:hover, .tier .ph.clickable:hover, .loc-card .ph.clickable:hover {
    filter: brightness(1.04);
  }
  .ph-expand {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: color-mix(in oklab, var(--bg) 85%, transparent);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: 13px; color: var(--ink-2);
    opacity: 0; transition: opacity .2s ease, background .2s ease;
  }
  .gallery-grid .ph:hover .ph-expand, .tier .ph.clickable:hover .ph-expand, .loc-card .ph.clickable:hover .ph-expand { opacity: 1; }

  /* ---------- Lightbox ---------- */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: color-mix(in oklab, var(--ink) 92%, black 8%);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    animation: lbFadeIn .22s ease;
  }
  @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox-inner {
    position: relative;
    width: 100%; max-width: 880px;
    animation: lbRise .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes lbRise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .lightbox-inner .ph { aspect-ratio: 16/10; border-radius: 10px; }
  .lightbox-caption {
    margin-top: 16px; text-align: center; color: #e7e0cf;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .04em;
  }
  .lightbox-caption .lb-count { color: #8c8473; margin-left: 8px; }
  .lb-btn {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    color: #f6f1e8; font-size: 16px; cursor: pointer;
    display: grid; place-items: center;
    transition: background .2s ease, transform .2s ease;
  }
  .lb-btn:hover { background: rgba(255,255,255,.18); }
  .lb-close { top: -52px; right: 0; }
  .lb-prev { left: -60px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: -60px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 760px) {
    .lb-prev { left: 4px; } .lb-next { right: 4px; }
    .lb-close { top: -44px; }
  }

  /* ---------- Payment calculator ---------- */
  .calc-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px; box-shadow: var(--shadow);
  }
  .calc-card h3 { font-size: 22px; margin-bottom: 4px; }
  .calc-card .calc-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 26px; }
  .calc-row { margin-bottom: 24px; }
  .calc-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .calc-row-head label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .calc-row-head .calc-live { font-family: 'Newsreader', serif; font-size: 17px; color: var(--accent); transition: color .15s ease; }
  .calc-select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink);
  }
  .calc-slider {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 999px; background: var(--line); outline: none; cursor: pointer;
  }
  .calc-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line);
    cursor: pointer; transition: transform .15s ease;
  }
  .calc-slider::-webkit-slider-thumb:hover { transform: scale(1.12); }
  .calc-slider::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--card);
    background: var(--accent); box-shadow: 0 0 0 1px var(--line); cursor: pointer;
  }
  .calc-toggle-row { display: flex; gap: 10px; }
  .calc-chip {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; color: var(--ink-2);
  }
  .calc-chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .calc-output {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-top: 8px; padding-top: 24px; border-top: 1px solid var(--line);
  }
  .calc-output .box {
    background: var(--bg-2); border-radius: 10px; padding: 16px;
  }
  .calc-output .box.wide { grid-column: 1 / -1; background: color-mix(in oklab, var(--gold) 16%, var(--bg)); }
  .calc-output .box .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
  .calc-output .box .val { font-family: 'Newsreader', serif; font-size: 26px; transition: color .15s ease; }
  .calc-output .box.wide .val { color: var(--terracotta); }
</style>
