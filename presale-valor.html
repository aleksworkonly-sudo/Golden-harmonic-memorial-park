<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Valor presale plots — staff only</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/logo-192.png" />
<meta name="theme-color" content="#2f5d4c" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script>window.React || document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"><\/script>');</script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script>window.ReactDOM || document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"><\/script>');</script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.Babel || document.write('<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js"><\/script>');</script>

<!-- Firebase (Firestore + Auth) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
  :root {
    --bg: #f6f1e8;
    --bg-2: #ece4d3;
    --ink: #1f2a26;
    --ink-2: #4a564f;
    --line: #d9cfbb;
    --accent: #2f5d4c;
    --accent-ink: #f6f1e8;
    --gold: #b08544;
    --terracotta: #b8593a;
    --card: #fbf7ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .display, h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; margin: 0; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  a { color: inherit; }
  .loading { min-height: 100vh; display: grid; place-items: center; font-size: 20px; color: var(--ink-2); }
</style>
</head>
<body>


<div id="root"><div class="loading">Loading…</div></div>
<script type="text/babel" src="presale.jsx"></script>
<script type="text/babel">
  // Staff only: tap the Valor-family plots that are for sale in the presale. All others stay held back.
  const VALOR = ['valor', 'premium-valor', 'corner-premium-valor'];
  function ValorAdmin() {
    const { useState, useEffect, useMemo } = React;
    const [user, setUser] = useState(undefined);
    const [email, setEmail] = useState(''); const [pass, setPass] = useState(''); const [err, setErr] = useState('');
    const [plan, setPlan] = useState(null);
    const [held, setHeld] = useState(null);
    const [open, setOpen] = useState(new Set());
    const [busy, setBusy] = useState(false); const [msg, setMsg] = useState('');
    const [filter, setFilter] = useState('');
    useEffect(() => firebase.auth().onAuthStateChanged((u) => setUser(u || null)), []);
    useEffect(() => { fetch('/presale-plan.json').then((r) => r.json()).then(setPlan); }, []);
    const valorLots = useMemo(() => {
      if (!plan) return [];
      const out = []; const { BY_LETTER } = window.PRESALE_PLAN_TYPES;
      for (let i = 0; i < plan.t.length; i++) if (VALOR.includes(BY_LETTER[plan.t[i]])) out.push(i + 1);
      return out;
    }, [plan]);
    const load = () => fetch('/api/presale?block=P', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
      const h = new Set(d.held || []); setHeld(h); setOpen(new Set(valorLots.filter((n) => !h.has(n))));
    });
    useEffect(() => { if (user && plan) load(); }, [user, plan]);
    const login = async (e) => { e.preventDefault(); setErr(''); try { await firebase.auth().signInWithEmailAndPassword(email.trim(), pass); } catch (x) { setErr('Wrong email or password.'); } };
    const toggle = (n) => {
      if (!valorLots.includes(n)) { setMsg('Only Valor, Premium Valor and Corner Premium Valor plots can be switched here.'); return; }
      setMsg(''); setOpen((s) => { const t = new Set(s); t.has(n) ? t.delete(n) : t.add(n); return t; });
    };
    const save = async () => {
      setBusy(true); setMsg('');
      try {
        const idToken = await firebase.auth().currentUser.getIdToken();
        const r = await fetch('/api/presale', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setValorOpen', idToken, open: [...open] }) });
        const d = await r.json().catch(() => ({}));
        setMsg(r.ok ? 'Saved. ' + d.count + ' Valor plots are now on sale in the presale.' : (d.error || 'Could not save.'));
      } finally { setBusy(false); }
    };
    const wrap = { maxWidth: 1100, margin: '0 auto', padding: 20 };
    const btn = { minHeight: 52, padding: '0 20px', borderRadius: 12, border: '2px solid #0f2a21', background: '#fff', fontSize: 18, fontWeight: 700, cursor: 'pointer', color: '#0f2a21' };
    if (user === undefined) return <div className="loading">Loading…</div>;
    if (!user) return (
      <form onSubmit={login} style={{ ...wrap, maxWidth: 420 }}>
        <h1>Valor presale plots</h1><p>Admin sign-in</p>
        <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={{ width: '100%', fontSize: 18, padding: 12, marginBottom: 10 }} />
        <input type="password" placeholder="Password" value={pass} onChange={(e) => setPass(e.target.value)} style={{ width: '100%', fontSize: 18, padding: 12, marginBottom: 10 }} />
        {err ? <p style={{ color: '#a33' }}>{err}</p> : null}
        <button style={{ ...btn, background: '#0f2a21', color: '#f6e7b4', width: '100%' }}>Sign in</button>
      </form>);
    const PM = window.PresalePlanMap;
    const openIds = { valor: true, 'premium-valor': true, 'corner-premium-valor': true };
    return (
      <div style={wrap}>
        <h1 style={{ fontSize: 34 }}>Valor plots for the presale</h1>
        <p style={{ fontSize: 18 }}>Touch a Valor, Premium Valor or Corner Premium Valor plot to switch it on (gold) or off. Gold plots are sold in the presale; all others are held back. Press Save when done.</p>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', margin: '10px 0' }}>
          <b style={{ alignSelf: 'center', fontSize: 20 }}>On sale: {open.size} of {valorLots.length}</b>
          {['', ...VALOR].map((f) => <button key={f} style={{ ...btn, background: filter === f ? '#f6e7b4' : '#fff' }} onClick={() => setFilter(f)}>{f ? window.PRESALE_PLAN_TYPES.TYPES[f].short : 'All Valor types'}</button>)}
          <button style={btn} onClick={() => setOpen(new Set(valorLots))}>Switch all on</button>
          <button style={btn} onClick={() => setOpen(new Set())}>Switch all off</button>
          <button style={{ ...btn, background: '#0f2a21', color: '#f6e7b4' }} disabled={busy} onClick={save}>{busy ? 'Saving…' : 'Save'}</button>
        </div>
        {msg ? <div role="alert" style={{ background: '#fff6dc', border: '1px solid #e3c978', borderRadius: 10, padding: 12, fontSize: 18, margin: '8px 0' }}>{msg}</div> : null}
        {plan && held ? <PM plan={plan} taken={new Set()} held={new Set()} marked={open} selected={0} filter={filter} openIds={openIds} onPick={toggle} onNotice={setMsg} focusLot={null} /> : <p>Loading the plan…</p>}
      </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<ValorAdmin />);
</script>
</body>
</html>
