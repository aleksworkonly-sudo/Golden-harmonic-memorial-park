<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Verify access — Golden Harmonic Memorial Park</title>
  <link rel="stylesheet" href="/payment-view.css">
  <script src="/payment-link.js" defer></script>
</head>
<body>
  <header class="pv-header"><a href="/">Golden Harmonic <span>Memorial Park</span></a></header>
  <main class="pv-wrap pv-narrow">
    <p class="pv-eyebrow">Your private payment history</p>
    <section class="pv-card">
      <h1>Confirm your access</h1>
      <p>Select Continue to open the reservation connected to your email link.</p>
      <p class="pv-muted">This link works once and expires after 15 minutes. Opening this page alone does not use it.</p>
      <p id="link-status" role="status" aria-live="polite"></p>
      <button id="verify-access" class="pv-primary" type="button">Continue securely</button>
      <a class="pv-secondary pv-block" href="/my-payments">Request a new link</a>
    </section>
  </main>
</body>
</html>
